  // Fallback: regular download
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ 已匯出 Excel', 'success');
}

/* ════════════════════════════════════════
   EXCEL IMPORT
   ════════════════════════════════════════ */
function buildAirportIndex() {
  const idx = {};
  Object.entries(GEO).forEach(([cc, country]) => {
    Object.entries(country.cities).forEach(([ck, city]) => {
      city.airports.forEach(ap => { idx[ap.c.toUpperCase()] = {country:cc, city:ck}; });
    });
  });
  return idx;
}

function extractAirportCode(raw) {
  if (!raw || raw === '—') return '';
  const m = raw.match(/[（(]([A-Z]{3,4})[）)]\s*$/);
  if (m) return m[1];
  if (/^[A-Z]{3,4}$/.test(raw.trim())) return raw.trim();
  return '';
}

function excelDateStr(val) {
  if (!val) return '';
  if (val instanceof Date) return val.toISOString().slice(0, 10);
  const s = String(val).trim();
  const m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : s;
}

async function importFromExcel(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('import-status');
  statusEl.textContent = '⏳ 讀取中…';
  try {
    const buf = await file.arrayBuffer();
    const wb  = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws  = wb.worksheets[0];
    const airIdx = buildAirportIndex();
    const newLegs = [];
    let tripDep = '', tripRet = '', dataStarted = false;

    ws.eachRow((row) => {
      const v  = row.values; // 1-indexed
      const c1 = String(v[1] || '').trim();
      if (c1 === 'TRIP_META') {
        tripDep = String(v[2] || '').trim();
        tripRet = String(v[3] || '').trim();
        return;
      }
      if (c1 === '航段') { dataStarted = true; return; }
      if (!dataStarted || !c1.startsWith('LEG')) return;

      const fromCode = extractAirportCode(String(v[2] || '').trim());
      const toCode   = extractAirportCode(String(v[3] || '').trim());
      const fromGeo  = (fromCode && airIdx[fromCode]) || {};
      const toGeo    = (toCode   && airIdx[toCode])   || {};

      newLegs.push({
        id: uid(),
        fromCountry: fromGeo.country || '', fromCity: fromGeo.city || '', fromAirport: fromCode,
        toCountry:   toGeo.country   || '', toCity:   toGeo.city   || '', toAirport:   toCode,
        flight:   String(v[4] || '').trim().toUpperCase(),
        depDate:  excelDateStr(v[5]),
        depTime:  String(v[6] || '').trim(),
        arrDate:  excelDateStr(v[7]),
        arrTime:  String(v[8] || '').trim(),
        autoFilled: false,
      });
    });

    if (!newLegs.length) { statusEl.textContent = '❌ 無有效資料'; return; }
    state.legs = newLegs;
    render();
    if (tripDep) { const el = document.getElementById('dep-date'); if (el) { el.value = tripDep; onTripDepDate(); } }
    if (tripRet) { const el = document.getElementById('ret-date'); if (el) { el.value = tripRet; calcDuration(); } }
    statusEl.textContent = `✅ ${newLegs.length} 段`;
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
    document.getElementById('builder').scrollIntoView({behavior:'smooth'});
    showToast(`✅ 已匯入 ${newLegs.length} 段航程，可繼續編輯`, 'success');
  } catch(e) {
    console.error(e);
    statusEl.textContent = '❌ 匯入失敗';
    showToast('❌ 匯入失敗，請確認格式正確', 'warn');
  }
  inputEl.value = '';
}

/* ════════════════════════════════════════
   SCHEDULE EXCEL IMPORT
   ════════════════════════════════════════ */
async function importFromScheduleExcel(inputEl) {
  const file = inputEl.files[0]; if (!file) return;
  const statusEl = document.getElementById('import-sched-status');
  statusEl.textContent = '⏳ 讀取中…';
  try {
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    if (!ws) { statusEl.textContent = '❌ 無工作表'; return; }

    const dates=[], dateLabels={}, locations={}, times=[], cells={}, merges=[];

    /* ── Helper: column letter(s) → 1-based number ── */
    function xlCol(s){ let n=0; for(let i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64); return n; }

    /* ── Step 1: parse all merge ranges FIRST ── */
    const parsedMergeRanges = [];
    const rawMerges = (ws.model && ws.model.merges) ? ws.model.merges : [];
    rawMerges.forEach(m => {
      let top, left, bottom, right;
      if (typeof m === 'string') {
        const x = m.replace(/\$/g,'').match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i);
        if (!x) return;
        left=xlCol(x[1].toUpperCase()); top=parseInt(x[2]);
        right=xlCol(x[3].toUpperCase()); bottom=parseInt(x[4]);
      } else {
        const o = m.model || m;
        top=o.top; left=o.left; bottom=o.bottom; right=o.right;
      }
      if (top && left) parsedMergeRanges.push({top,left,bottom,right});
    });

    const slaveCells = new Set();
    parsedMergeRanges.forEach(({top,left,bottom,right}) => {
      for (let r=top; r<=bottom; r++)
        for (let c=left; c<=right; c++)
          if (!(r===top && c===left)) slaveCells.add(`${r}_${c}`);
    });

    let maxDataCol = 1;
    ws.getRow(2).eachCell({includeEmpty:false}, (cell, cn) => { if (cn>maxDataCol) maxDataCol=cn; });

    const _refYear = (() => {
      const dv = document.getElementById('dep-date')?.value || '';
      if (dv) return parseInt(dv.slice(0,4));
      const firstLeg = state?.legs?.[0];
      if (firstLeg?.depDate) return parseInt(firstLeg.depDate.slice(0,4));
      return new Date().getFullYear();
    })();
    const _parseDateLabel = (label, prevMonth) => {
      const m = String(label).match(/^(\d{1,2})\/(\d{1,2})/);
      if (!m) return null;
      const mo = parseInt(m[1]), dy = parseInt(m[2]);
      let yr = _refYear;
      if (prevMonth !== null && mo < prevMonth) yr++;
      return `${yr}-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
    };
    let _prevMonth = null, _isoYear = _refYear;
    for (let cn=2; cn<=maxDataCol; cn++) {
      if (slaveCells.has(`2_${cn}`)) continue;
      const val = String(ws.getRow(2).getCell(cn).value || '').trim();
      if (!val) continue;
      let key = null;
      const isoGuess = _parseDateLabel(val, _prevMonth);
      if (isoGuess) {
        let candidate = isoGuess, dedup = 1;
        while (dates.includes(candidate)) candidate = isoGuess + '_' + (dedup++);
        key = candidate;
        const mo = parseInt(val.match(/^(\d{1,2})\//)?.[1] || '0');
        if (mo) _prevMonth = mo;
      } else {
        key = `col_${cn}`;
      }
      dates.push(key);
      dateLabels[key] = val;
    }
    if (!dates.length) { statusEl.textContent = '❌ 無欄位資料'; return; }

    dates.forEach((d, ci) => {
      const cn = ci+2;
      if (slaveCells.has(`3_${cn}`)) return;
      locations[d] = String(ws.getRow(3).getCell(cn).value || '').trim();
    });

    let ri = 0;
    const noteContent = {};
    ws.eachRow((row, rowNum) => {
      if (rowNum < 4) return;
      const timeVal = String(row.getCell(1).value || '').trim();
      if (!timeVal) return;
      if (timeVal.replace(/[^\w]/g,'').toLowerCase() === 'note') {
        dates.forEach((d, ci) => {
          const cn = ci+2;
          const val = String(row.getCell(cn).value || '').trim();
          if (val) noteContent[String(ci)] = val;
        });
        return;
      }
      times.push(timeVal);
      dates.forEach((d, ci) => {
        const cn = ci+2;
        if (slaveCells.has(`${rowNum}_${cn}`)) return; 
        const val = String(row.getCell(cn).value || '').trim();
        if (val) cells[`${ri},${ci}`] = val;
      });
      ri++;
    });

    parsedMergeRanges.forEach(({top,left,bottom,right}) => {
      const mr1=top-4, mr2=bottom-4, mc1=left-2, mc2=right-2;
      if (mr1<0 || mc1<0 || mr2>=times.length || mc2>=dates.length) return;
      const content = cells[`${mr1},${mc1}`] || '';
      for (let r=mr1; r<=mr2; r++)
        for (let c=mc1; c<=mc2; c++)
          delete cells[`${r},${c}`];
      merges.push({r1:mr1, c1:mc1, r2:mr2, c2:mc2, content});
    });

    const rowTypes = times.map(t => /^\d{1,2}:\d{2}$/.test(t) ? 'time' : 'note');
    schedState = {dates, dateLabels, times, rowTypes, locations, cells, merges, selected:[], selectedTimeRow:null, noteContent, bgColors:{}};
    renderScheduleTable();

    const sec = document.getElementById('schedule');
    sec.style.display = 'block';
    sec.scrollIntoView({behavior:'smooth', block:'start'});

    statusEl.textContent = `✅ ${dates.length} 天`;
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
    showToast(`✅ 已匯入行程計畫（${dates.length} 天 × ${times.length} 時段）`, 'success');
  } catch(e) {
    console.error(e);
    statusEl.textContent = '❌ 匯入失敗';
    showToast('❌ 匯入失敗，請確認為行程計畫格式', 'warn');
  }
  inputEl.value = '';
}

function fmtDate(d){
  if(!d)return'';
  const dt=new Date(d+'T12:00:00');
  if(isNaN(dt))return d;
  return dt.toLocaleDateString('zh-TW',{year:'numeric',month:'short',day:'numeric',weekday:'short'});
}

/* ════════════════════════════════════════
   SCHEDULE — STATE & RENDERING
   ════════════════════════════════════════ */
let schedState = null;
const SDAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function initSchedState(dep, ret) {
  const dates = [];
  let cur = new Date(dep + 'T12:00:00');
  const end = new Date(ret + 'T12:00:00');
  while (cur <= end && dates.length < 32) {
    dates.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate()+1);
  }
  const dateLabels = {};
  dates.forEach(d => {
    const dt = new Date(d+'T12:00:00');
    dateLabels[d] = `${dt.getMonth()+1}/${dt.getDate()} (${SDAY[dt.getDay()]})`;
  });
  const times = [];
  const rowTypes = [];
  for (let h=0; h<=23; h++) { times.push(`${String(h).padStart(2,'0')}:00`); rowTypes.push('time'); }
  schedState = {dates, dateLabels, times, rowTypes, locations:{}, cells:{}, merges:[], selected:[], selectedTimeRow:null, noteContent:{}, bgColors:{}};
}

function sMergeOrigin(r,c){ return schedState.merges.find(m=>m.r1===r&&m.c1===c)||null; }
function sMergeCovered(r,c){
  return schedState.merges.some(m=>r>=m.r1&&r<=m.r2&&c>=m.c1&&c<=m.c2&&!(r===m.r1&&c===m.c1));
}
function sCellInMerge(r,c){
  return schedState.merges.some(m=>r>=m.r1&&r<=m.r2&&c>=m.c1&&c<=m.c2);
}

function renderScheduleTable() {
  const s = schedState;
  if (!s.rowTypes) { s.rowTypes = s.times.map(t => /^\d{1,2}:\d{2}$/.test(t) ? 'time' : 'note'); }
  if (!s.noteContent) s.noteContent = {};
  let html = '<thead>';

  /* Row 1 — date headers */
  html += '<tr class="sched-hd-row">';
  html += '<th class="sched-corner">⏱ 時間</th>';
  s.dates.forEach((d, ci) => {
    html += `<th class="sched-date-hd-cell"><div class="sched-date-hd-inner" contenteditable="true" `+
      `onblur="onSDate(${ci},this)">${esc(s.dateLabels[d]||'')}</div></th>`;
  });
  html += `<th class="sched-add-col-th"><button class="sched-add-btn sched-add-col-btn" onclick="schedAddCol()">＋ 欄</button></th>`;
  html += '</tr>';

  /* Row 2 — location row */
  html += '<tr class="sched-loc-row">';
  html += '<th class="sched-loc-corner">📍 地點</th>';
  s.dates.forEach((d, ci) => {
    html += `<td class="sched-loc-cell"><div class="sched-loc-inner" contenteditable="true" `+
      `onblur="onSLoc(${ci},this)">${esc(s.locations[d]||'')}</div></td>`;
  });
  html += '<td class="sched-add-col-loc"></td>';
  html += '</tr></thead><tbody>';

  /* Data rows */
  s.times.forEach((t, ri) => {
    const rowType = s.rowTypes[ri] || 'time';
    const isNoteRow = rowType === 'note';
    const isSelected = s.selectedTimeRow === ri;
    const rowCls = [
      isSelected ? 'sched-row-time-selected' : '',
      isNoteRow ? 'sched-row-note' : ''
    ].filter(Boolean).join(' ');
    const dragAttrs = isNoteRow
      ? `draggable="true" ondragstart="sDragStart(event,${ri})" ondragover="sDragOver(event,${ri})" ondrop="sDrop(event,${ri})" ondragleave="sDragLeave(event,${ri})"`
      : '';
    html += `<tr class="${rowCls}" data-ri="${ri}" ${dragAttrs}>`;

    /* Time cell */
    const circleActiveCls = isSelected ? ' t-active' : '';
    if (isNoteRow) {
      html += `<td class="sched-time sched-time-custom">` +
        `<span class="sched-drag-handle">⠿⠿</span>` +
        `<button class="sched-time-circle${circleActiveCls}" onclick="sSelectTimeRow(${ri})" title="選取/操作此列"></button>` +
        `<div class="sched-time-inner" contenteditable="true" onblur="onSTime(${ri},this)">${esc(t)}</div>`;
    } else {
      html += `<td class="sched-time">` +
        `<button class="sched-time-circle${circleActiveCls}" onclick="sSelectTimeRow(${ri})" title="選取/操作此列"></button>` +
        `${esc(t)}`;
    }
    if (isSelected) {
      html += `<div class="sched-time-toolbar">` +
        `<button class="sched-time-tool-btn scht-add" onclick="sAddSlotDialog(${ri},'above')" title="在此列上方新增時段">▲＋</button>` +
        `<button class="sched-time-tool-btn scht-add" onclick="sAddSlotDialog(${ri},'below')" title="在此列下方新增時段">▼＋</button>` +
        `<button class="sched-time-tool-btn scht-del" onclick="sDeleteSlot(${ri})" title="刪除此列">🗑</button>` +
        `</div>`;
    }
    html += '</td>';

    /* Data cells */
    s.dates.forEach((d, ci) => {
      if (sMergeCovered(ri,ci)) return;
      const mg = sMergeOrigin(ri,ci);
      const cs = mg ? mg.c2-mg.c1+1 : 1;
      const rs = mg ? mg.r2-mg.r1+1 : 1;
      const content = mg ? (mg.content||'') : (s.cells[`${ri},${ci}`]||'');
      const isSel = s.selected.some(x=>x.r===ri&&x.c===ci);
      
      const customBg = (s.bgColors && s.bgColors[`${ri},${ci}`]) ? `background-color: ${s.bgColors[`${ri},${ci}`]} !important;` : '';
      
      let cls = 'sched-data-cell' + (isSel?' sched-selected':'') + (mg?' sched-merged':'');
      let attrs = ` class="${cls}"` + (cs>1?` colspan="${cs}"`:'')+
        (rs>1?` rowspan="${rs}"`:'') + ` data-row="${ri}" data-col="${ci}"` + (customBg ? ` style="${customBg}"` : '');

      html += `<td${attrs}><div class="sched-cell-inner" contenteditable="true" `+
        `onblur="onSCell(${ri},${ci},this)">${esc(content)}</div>`;
      if (mg) {
        html += `<button class="sched-merge-circle sched-split-btn" onclick="sSplit(${ri},${ci})" title="拆分">✕</button>`;
      } else {
        html += `<button class="sched-merge-circle" onclick="sToggleSel(${ri},${ci})" title="選取"></button>`;
      }
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';

  /* Note footer row */
  html += '<tfoot><tr class="sched-note-footer">';
  html += '<td class="sched-time sched-note-time-cell">📝 Note</td>';
  s.dates.forEach((d, ci) => {
    const nc = s.noteContent[String(ci)] || '';
    html += `<td class="sched-note-data-cell"><div class="sched-note-cell-inner" contenteditable="true" `+
      `onblur="onSNote(${ci},this)">${esc(nc)}</div></td>`;
  });
  html += '<td class="sched-note-add-cell"></td>';
  html += '</tr></tfoot>';

  document.getElementById('sched-table').innerHTML = html;

  /* Fix row-2 sticky top offset */
  requestAnimationFrame(() => {
    const hdTh = document.querySelector('.sched-table thead tr.sched-hd-row th');
    if (hdTh) {
      const h = hdTh.offsetHeight + 'px';
      document.querySelectorAll('.sched-table thead tr.sched-loc-row td, .sched-table thead tr.sched-loc-row th')
        .forEach(el => { el.style.top = h; });
    }
  });
  updateSMergeBar();
}

/* ── Handlers ── */
function onSDate(ci, el) {
  const d = schedState.dates[ci];
  if (d!=null) schedState.dateLabels[d] = el.innerText||el.textContent||'';
}
function onSLoc(ci, el) {
  const d = schedState.dates[ci];
  if (d!=null) schedState.locations[d] = el.innerText||el.textContent||'';
}
function onSCell(ri, ci, el) {
  const mg = sMergeOrigin(ri,ci);
  const v = el.innerText||el.textContent||'';
  if (mg) mg.content = v; else schedState.cells[`${ri},${ci}`] = v;
}
function onSTime(ri, el) {
  schedState.times[ri] = el.innerText||el.textContent||'';
}

/* ── Selection & Merge ── */
function sToggleSel(r, c) {
  if (sCellInMerge(r,c)) return;
  const s = schedState;
  const idx = s.selected.findIndex(x=>x.r===r&&x.c===c);
  if (idx>=0) s.selected.splice(idx,1); else s.selected.push({r,c});
  const td = document.querySelector(`.sched-data-cell[data-row="${r}"][data-col="${c}"]`);
  if (td) {
    td.classList.toggle('sched-selected', idx<0);
    const btn = td.querySelector('.sched-merge-circle');
    if (btn) btn.style.background = idx<0 ? '#fbbf24' : '';
  }
  updateSMergeBar();
}

function updateSMergeBar() {
  const bar = document.getElementById('sched-merge-bar');
  if (!bar) return;
  const n = schedState ? schedState.selected.length : 0;
  
  if (n > 0) {
    let html = `<span>已選取 ${n} 格</span>`;
    
    if (n >= 2) {
      html += `<button class="sched-merge-confirm-btn" onclick="sMerge()">⊞ 合併選取</button>`;
    }

    html += `
      <div class="color-palette">
        <button class="sched-color-btn" style="background:#fecaca" onclick="sApplyColor('#fecaca')" title="紅色"></button>
        <button class="sched-color-btn" style="background:#bbf7d0" onclick="sApplyColor('#bbf7d0')" title="綠色"></button>
        <button class="sched-color-btn" style="background:#bfdbfe" onclick="sApplyColor('#bfdbfe')" title="藍色"></button>
        <button class="sched-color-btn" style="background:#fef08a" onclick="sApplyColor('#fef08a')" title="黃色"></button>
        <button class="sched-color-btn" style="background:#e9d5ff" onclick="sApplyColor('#e9d5ff')" title="紫色"></button>
        <button class="sched-color-btn c-clear" onclick="sApplyColor('')" title="清除顏色"></button>
      </div>
      <button class="sched-cancel-sel-btn" style="margin-left:5px" onclick="sCancelSel()">✕ 取消</button>
    `;
    
    bar.innerHTML = html;
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
  }
}

function sApplyColor(colorHex) {
  const s = schedState;
  if (!s || s.selected.length === 0) return;
  if (!s.bgColors) s.bgColors = {};

  s.selected.forEach(pos => {
    if (colorHex) {
      s.bgColors[`${pos.r},${pos.c}`] = colorHex;
    } else {
      delete s.bgColors[`${pos.r},${pos.c}`];
    }
  });
  
  sCancelSel(); 
  renderScheduleTable();
}

function sMerge() {
  const s = schedState;
  if (s.selected.length < 2) return;
  const rows = s.selected.map(x=>x.r), cols = s.selected.map(x=>x.c);
  const r1=Math.min(...rows),r2=Math.max(...rows),c1=Math.min(...cols),c2=Math.max(...cols);
  if (s.selected.length !== (r2-r1+1)*(c2-c1+1)) {
    showToast('⚠ 選取範圍必須為矩形','warn'); return;
  }
  if (s.merges.some(m=>!(m.r2<r1||m.r1>r2||m.c2<c1||m.c1>c2))) {
    showToast('⚠ 與現有合併儲存格重疊','warn'); return;
  }
  const content = s.cells[`${r1},${c1}`]||'';
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) delete s.cells[`${r},${c}`];
  s.merges.push({r1,c1,r2,c2,content});
  s.selected = [];
  renderScheduleTable();
  showToast('✅ 已合併','success');
}

function sSplit(r, c) {
  const s = schedState;
  const idx = s.merges.findIndex(m=>m.r1===r&&m.c1===c);
  if (idx<0) return;
  s.cells[`${r},${c}`] = s.merges[idx].content||'';
  s.merges.splice(idx,1);
  renderScheduleTable();
  showToast('✅ 已拆分','success');
}

function sCancelSel() {
  schedState.selected = [];
  document.querySelectorAll('.sched-data-cell.sched-selected').forEach(el=>{
    el.classList.remove('sched-selected');
    const btn=el.querySelector('.sched-merge-circle'); if (btn) btn.style.background='';
  });
  updateSMergeBar();
}

/* ── Time row selection & add/delete ── */
function sSelectTimeRow(ri) {
  const s = schedState;
  s.selectedTimeRow = (s.selectedTimeRow === ri) ? null : ri;
  renderScheduleTable();
}

function sAddSlotDialog(ri, position) {
  const val = prompt('輸入時段 (如 10:30) 或標籤 (如 Hotel):');
  if (val === null) return;
  const trimmed = val.trim();
  if (!trimmed) return;
  const s = schedState;
  const isTimeFormat = /^\d{1,2}:\d{2}$/.test(trimmed);
  const type = isTimeFormat ? 'time' : 'note';
  const label = isTimeFormat ? trimmed.padStart(5, '0').replace(/^(\d):/, '0$1:') : trimmed;
  const normLabel = isTimeFormat ? label.replace(/^(\d{1}):/, '0$1:') : label;

  let insertIdx;
  if (isTimeFormat) {
    insertIdx = sTimeSortedIdx(normLabel);
  } else {
    insertIdx = position === 'above' ? ri : ri + 1;
  }
  sInsertRow(insertIdx, normLabel, type);
  s.selectedTimeRow = null;
  renderScheduleTable();
  showToast(`✅ 已新增「${normLabel}」${type==='time'?'時段':'標籤'}`, 'success');
}

function sTimeSortedIdx(timeStr) {
  const s = schedState;
  const [h, m] = timeStr.split(':').map(Number);
  const val = h * 60 + m;
  for (let i = 0; i < s.times.length; i++) {
    if ((s.rowTypes[i] || 'time') !== 'time') continue;
    const parts = s.times[i].split(':').map(Number);
    if (parts[0]*60+parts[1] >= val) return i;
  }
  return s.times.length;
}

function sInsertRow(insertIdx, label, type) {
  const s = schedState;
  const newCells = {};
  Object.keys(s.cells).forEach(k => {
    const [ri, ci] = k.split(',').map(Number);
    newCells[ri >= insertIdx ? `${ri+1},${ci}` : k] = s.cells[k];
  });
  s.cells = newCells;
  s.merges.forEach(mg => {
    if (mg.r1 >= insertIdx) { mg.r1++; mg.r2++; }
    else if (mg.r2 >= insertIdx) { mg.r2++; }
  });
  s.selected = s.selected.map(x => ({...x, r: x.r >= insertIdx ? x.r+1 : x.r}));
  s.times.splice(insertIdx, 0, label);
  if (!s.rowTypes) s.rowTypes = s.times.map(() => 'time');
  s.rowTypes.splice(insertIdx, 0, type);
}

function sDeleteSlot(ri) {
  const s = schedState;
  if (s.times.length <= 1) { showToast('⚠ 至少保留一個時段','warn'); return; }
  const label = s.times[ri];
  const newCells = {};
  Object.keys(s.cells).forEach(k => {
    const [rowIdx, ci] = k.split(',').map(Number);
    if (rowIdx === ri) return;
    newCells[rowIdx > ri ? `${rowIdx-1},${ci}` : k] = s.cells[k];
  });
  s.cells = newCells;
  s.merges = s.merges
    .filter(mg => !(mg.r1 <= ri && mg.r2 >= ri))
    .map(mg => {
      if (mg.r1 > ri) return {...mg, r1:mg.r1-1, r2:mg.r2-1};
      if (mg.r2 > ri) return {...mg, r2:mg.r2-1};
      return mg;
    });
  s.selected = s.selected.filter(x=>x.r!==ri).map(x=>({...x, r:x.r>ri?x.r-1:x.r}));
  s.times.splice(ri, 1);
  if (s.rowTypes) s.rowTypes.splice(ri, 1);
  s.selectedTimeRow = null;
  renderScheduleTable();
  showToast(`✅ 已刪除「${label}」`, 'success');
}

/* ── Note row ── */
function onSNote(ci, el) {
  const s = schedState;
  if (!s.noteContent) s.noteContent = {};
  s.noteContent[String(ci)] = el.innerText || el.textContent || '';
}

/* ── Drag & Drop for note rows ── */
let _dragSrcRi = null;

function sDragStart(event, ri) {
  _dragSrcRi = ri;
  event.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const tr = document.querySelector(`.sched-table tbody tr[data-ri="${ri}"]`);
    if (tr) tr.classList.add('dragging-ghost');
  }, 0);
}

function sDragOver(event, ri) {
  if (_dragSrcRi === null || _dragSrcRi === ri) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const tr = document.querySelector(`.sched-table tbody tr[data-ri="${ri}"]`);
  if (!tr) return;
  const rect = tr.getBoundingClientRect();
  const midY = rect.top + rect.height / 2;
  tr.classList.remove('drag-over-top','drag-over-bottom');
  tr.classList.add(event.clientY < midY ? 'drag-over-top' : 'drag-over-bottom');
}

function sDragLeave(event, ri) {
  const tr = document.querySelector(`.sched-table tbody tr[data-ri="${ri}"]`);
  if (tr) tr.classList.remove('drag-over-top','drag-over-bottom');
}

function sDrop(event, targetRi) {
  event.preventDefault();
  const s = schedState;
  const srcRi = _dragSrcRi;
  _dragSrcRi = null;
  if (srcRi === null || srcRi === targetRi) { renderScheduleTable(); return; }
  const tr = document.querySelector(`.sched-table tbody tr[data-ri="${targetRi}"]`);
  let insertBefore = true;
  if (tr) {
    const rect = tr.getBoundingClientRect();
    insertBefore = event.clientY < rect.top + rect.height / 2;
  }
  let dstRi = insertBefore ? targetRi : targetRi + 1;
  if (dstRi > srcRi) dstRi--; 
  sMoveRow(srcRi, dstRi);
  s.selectedTimeRow = null;
  renderScheduleTable();
}

function sMoveRow(srcRi, dstRi) {
  if (srcRi === dstRi) return;
  const s = schedState;
  const srcCells = {};
  const newCells = {};
  Object.keys(s.cells).forEach(k => {
    const [ri, ci] = k.split(',').map(Number);
    if (ri === srcRi) { srcCells[ci] = s.cells[k]; return; }
    let nr = ri;
    if (srcRi < dstRi) { if (ri > srcRi && ri <= dstRi) nr = ri - 1; }
    else { if (ri >= dstRi && ri < srcRi) nr = ri + 1; }
    newCells[`${nr},${ci}`] = s.cells[k];
  });
  Object.keys(srcCells).forEach(ci => { newCells[`${dstRi},${ci}`] = srcCells[ci]; });
  s.cells = newCells;
  s.merges = [];
  s.selected = [];
  const [mt] = s.times.splice(srcRi, 1);
  const [mrt] = s.rowTypes.splice(srcRi, 1);
  s.times.splice(dstRi, 0, mt);
  s.rowTypes.splice(dstRi, 0, mrt);
}

function schedAddCol() {
  const s = schedState;
  const lastD = s.dates[s.dates.length-1];
  let nd = new Date().toISOString().slice(0,10);
  if (lastD) {
    const base = lastD.split('_')[0];
    const d = new Date(base+'T12:00:00');
    if (!isNaN(d)) { d.setDate(d.getDate()+1); nd=d.toISOString().slice(0,10); }
  }
  let key=nd, n=1;
  while (s.dates.includes(key)) key=nd+'_'+(n++);
  const dt=new Date(nd+'T12:00:00');
  s.dates.push(key);
  s.dateLabels[key]=isNaN(dt)?'新增欄':`${dt.getMonth()+1}/${dt.getDate()} (${SDAY[dt.getDay()]})`;
  renderScheduleTable();
}

/* ════════════════════════════════════════
   AUTO-FILL FLIGHTS INTO SCHEDULE TABLE
   ════════════════════════════════════════ */
function _findDateColIdx(isoDate) {
  const s = schedState;
  if (!isoDate) return -1;
  const direct = s.dates.indexOf(isoDate);
  if (direct >= 0) return direct;
  const parts = isoDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!parts) return -1;
  const mo = parseInt(parts[2]), dy = parseInt(parts[3]);
  for (let ci = 0; ci < s.dates.length; ci++) {
    const label = s.dateLabels[s.dates[ci]] || '';
    const lm = label.match(/^(\d{1,2})\/(\d{1,2})/);
    if (lm && parseInt(lm[1]) === mo && parseInt(lm[2]) === dy) return ci;
  }
  return -1;
}

function autoFillFlightsToSchedule(silent) {
  const s = schedState;
  if (!s) { if (!silent) showToast('⚠ 請先產生行程時間表', 'warn'); return; }
  if (!state || !state.legs || !state.legs.length) { if (!silent) showToast('⚠ 請先填入航段資料', 'warn'); return; }

  // Strip every previously auto-filled flight line from every cell before
  // writing again. This is pattern-based (recognizes the ✈/🛬 prefix this
  // function always writes) rather than relying on in-memory bookkeeping,
  // so it correctly overwrites even across a page reload, a fresh Excel
  // import, or a schedule that already has old auto-filled lines baked in
  // — any of which would otherwise keep stacking up duplicates on each run.
  // Manually-typed notes (which won't start with those exact emoji) are left alone.
  _stripAutoFillLines(s);

  let filled = 0;

  state.legs.forEach(leg => {
    const fn   = (leg.flight      || '').trim().toUpperCase();
    const from = (leg.fromAirport || '').trim().toUpperCase();
    const to   = (leg.toAirport   || '').trim().toUpperCase();
    if (!fn && !from && !to) return;

    const depDate = leg.depDate || '';
    const depTime = _normTime(leg.depTime || '');
    if (depDate && depTime) {
      const ci = _findDateColIdx(depDate);
      if (ci >= 0) {
        const ri = _ensureTimeRow(depTime);
        _setSchedCell(ri, ci, _buildDepLabel(fn, from, to, depTime));
        filled++;
      }
    }

    const arrDate = leg.arrDate || leg.depDate || '';
    const arrTime = _normTime(leg.arrTime || '');
    if (arrDate && arrTime) {
      const ci = _findDateColIdx(arrDate);
      if (ci >= 0) {
        const ri = _ensureTimeRow(arrTime);
        _setSchedCell(ri, ci, _buildArrLabel(fn, from, to, arrTime));
        filled++;
      }
    }
  });

  if (!silent) {
    renderScheduleTable();
    showToast(filled > 0
      ? `✅ 已填入 ${filled} 筆航班資訊`
      : '⚠ 無可填入的航班（請確認航段已填入日期與時間）',
      filled > 0 ? 'success' : 'warn');
  }
}

/* Remove every line matching this function's own output format
   (starts with "✈ " or "🛬 ") from every schedule cell, so re-running
   auto-fill always starts from a clean slate instead of stacking copies. */
function _stripAutoFillLines(s) {
  Object.keys(s.cells).forEach(key => {
    const content = s.cells[key];
    if (!content) return;
    // NOTE: the "u" flag is required here — 🛬 (U+1F6EC) is outside the
    // Basic Multilingual Plane and encoded as a UTF-16 surrogate pair.
    // Without "u", a character class containing it silently splits into
    // its two surrogate halves instead of matching the whole emoji, so
    // "🛬 ..." lines never matched and kept duplicating on every run
    // (while "✈ ..." lines, a plain BMP character, worked fine — exactly
    // the asymmetric bug that was reported).
    const kept = content.split('\n').filter(line => !/^[✈🛬]\s/u.test(line));
    if (kept.length !== content.split('\n').length) {
      s.cells[key] = kept.join('\n');
    }
  });
}

function _normTime(t) {
  if (!t) return '';
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})/);
  if (!m) return '';
  return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
}

function _ensureTimeRow(timeStr) {
  const s = schedState;
  const existing = s.times.indexOf(timeStr);
  if (existing >= 0) return existing;
  const insertIdx = sTimeSortedIdx(timeStr);
  sInsertRow(insertIdx, timeStr, 'time');
  return insertIdx;
}

function _setSchedCell(ri, ci, label) {
  const s = schedState;
  const key = `${ri},${ci}`;
  const existing = (s.cells[key] || '').trim();
  s.cells[key] = existing ? `${existing}\n${label}` : label;
}

function _buildDepLabel(fn, from, to, time) {
  const route = (from && to) ? `${from}→${to}` : (from || to || '');
  if (fn && route) return `✈ ${fn} ${route}`;
  if (fn)    return `✈ ${fn} 起飛`;
  if (route) return `✈ ${route}`;
  return `✈ 起飛 ${time}`;
}

function _buildArrLabel(fn, from, to, time) {
  const dest = to || from || '';
  if (fn && dest) return `🛬 ${fn} 抵 ${dest}`;
  if (fn)   return `🛬 ${fn} 降落`;
  if (dest) return `🛬 抵 ${dest}`;
  return `🛬 降落 ${time}`;
}

function generateSchedule() {
  const depEl=document.getElementById('dep-date'), retEl=document.getElementById('ret-date');
  if (!depEl.value&&state.legs[0]?.depDate){depEl.value=state.legs[0].depDate;onTripDepDate();}
  if (!retEl.value){
    const ll=state.legs[state.legs.length-1];
    const ld=ll.arrDate||ll.depDate; if(ld){retEl.value=ld;calcDuration();}
  }
  const dep=depEl.value, ret=retEl.value;
  if (!dep){showToast('⚠ 請先填入出發日期','warn');return;}
  if (!ret){showToast('⚠ 請先填入回程日期','warn');return;}
  if (ret<dep){showToast('⚠ 回程日期不可早於出發日期','warn');return;}
  if (schedState&&schedState.dates[0]===dep&&
      schedState.dates.filter(d=>!d.includes('_')).slice(-1)[0]===ret) {
    document.getElementById('schedule').style.display='block';
    document.getElementById('schedule').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  initSchedState(dep,ret);
  autoFillFlightsToSchedule(true); 
  renderScheduleTable();
  document.getElementById('schedule').style.display='block';
  document.getElementById('schedule').scrollIntoView({behavior:'smooth',block:'start'});
  showToast(`✅ 已產生 ${schedState.dates.length} 天行程表`, 'success');
}

function clearSchedule() {
  document.getElementById('schedule').style.display='none';
}

/* ════════════════════════════════════════
   FLIGHT MAP  (Generate Map) — MapLibre GL
   ════════════════════════════════════════ */
let _flightMap = null;
let _mapMarkers = [];
let _mapIs3D = false;
let _mapPlottedStops = [];
/* Real NASA satellite imagery instead of a stylized vector basemap:
   - Day:   "Blue Marble" (MODIS) — a static, cloud-free true-color composite
            of Earth. Looks like an actual photo of the day side.
   - Night: "Black Marble" (VIIRS) — a static night-lights composite showing
            real city-light clusters on the dark side, the classic "Earth at
            night" look.
   Both are served free, with no API key, by NASA's public GIBS WMTS tile
   service — plain HTTP tile requests, no CDN Web Workers involved (that was
   what made CesiumJS unusable under file://; MapLibre's own worker already
   works fine in this app). Both layers cap out at zoom 8 (~500m/px); that's
   set as the source maxzoom so MapLibre correctly upscales past it instead
   of requesting tiles that don't exist — plenty of detail for whole-world
   flight-route views, which is all this map is used for. */
/* Country/state borders + name labels, as a TILED vector overlay rather
   than one giant GeoJSON blob. Two things ruled out plain GeoJSON files:
   - Natural Earth's lightweight 110m admin-1 file turns out to only cover
     US states (confirmed against the live data) — nothing for China or
     anywhere else.
   - The resolution that DOES have full global admin-1 coverage (10m) is a
     ~24MB single download, re-fetched and re-parsed on every day/night
     toggle — impractical for a single-file app.
   CARTO's own vector tile source (the same "carto.streets" dataset behind
   the Voyager/Positron/Dark-Matter styles used earlier) is built on the
   OpenMapTiles schema, which DOES have genuinely global admin-1 coverage
   (including China's provinces) sourced from Natural Earth's 10m data —
   and because it's proper vector TILES, the browser only ever fetches the
   small number of tiles covering the current view, at the current zoom,
   same as the raster imagery tiles. We only pull its "boundary" and
   "place" layers here (borders + admin labels) — none of its roads,
   buildings, or water fill, since the satellite/night-lights photo is
   already the actual basemap. */
function buildEarthRasterStyle(tileUrl, bgColor) {
  return {
    version: 8,
    // Needed for the label symbol layers below — without a glyphs URL,
    // MapLibre has nowhere to fetch text glyphs from and text-field
    // labels silently render as nothing (no error, just invisible).
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      'earth-raster': {
        type: 'raster',
        tiles: [tileUrl],
        tileSize: 256,
        maxzoom: 8,
        attribution: '© NASA EOSDIS GIBS / MODIS / VIIRS'
      },
      'carto-admin': {
        type: 'vector',
        url: 'https://tiles.basemaps.cartocdn.com/vector/carto.streets/v1/tiles.json'
      }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': bgColor } },
      { id: 'earth-raster-layer', type: 'raster', source: 'earth-raster', paint: { 'raster-fade-duration': 0 } },
      // State/province borders (OpenMapTiles admin_level 4) — thin, dashed,
      // drawn under the country lines. Only from zoom 4 on, matching where
      // this tileset actually carries state-level boundary detail.
      {
        id: 'admin1-line', type: 'line', source: 'carto-admin', 'source-layer': 'boundary',
        minzoom: 4,
        filter: ['all', ['==', ['get', 'admin_level'], 4], ['==', ['get', 'maritime'], 0]],
        paint: {
          'line-color': '#ffffff',
          'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.4, 9, 1.2],
          'line-opacity': 0.3,
          'line-dasharray': [2, 2]
        }
      },
      // Country borders (admin_level 2) — a touch bolder/brighter so they
      // read over both the day photo and the night lights.
      {
        id: 'admin0-line', type: 'line', source: 'carto-admin', 'source-layer': 'boundary',
        filter: ['all', ['==', ['get', 'admin_level'], 2], ['==', ['get', 'maritime'], 0]],
        paint: {
          'line-color': '#ffffff',
          'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.6, 8, 1.8],
          'line-opacity': 0.55
        }
      },
      // State/province name labels (e.g. US states, China's provinces).
      // "name_en" is the English-name field this tileset exposes — same
      // field the country labels below use. Only from zoom 5, matching
      // where CARTO's own styles start showing state-level place labels.
      {
        id: 'admin1-label', type: 'symbol', source: 'carto-admin', 'source-layer': 'place',
        minzoom: 5,
        filter: ['==', ['get', 'class'], 'state'],
        layout: {
          'text-field': ['get', 'name_en'],
          'text-font': ['Open Sans Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 5, 9, 9, 12]
        },
        paint: {
          'text-color': '#dbe9ff',
          'text-halo-color': 'rgba(0,0,0,0.8)',
          'text-halo-width': 1.1
        }
      },
      // Country name labels. text-halo makes them legible against whatever
      // photo color happens to be underneath (ocean, land, city lights).
      {
        id: 'admin0-label', type: 'symbol', source: 'carto-admin', 'source-layer': 'place',
        filter: ['==', ['get', 'class'], 'country'],
        layout: {
          'text-field': ['get', 'name_en'],
          'text-font': ['Open Sans Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 1, 9, 6, 13]
        },
        paint: {
          'text-color': '#ffffff',
          'text-halo-color': 'rgba(0,0,0,0.85)',
          'text-halo-width': 1.2
        }
      }
    ]
  };
}
const MAP_STYLE_DAY = buildEarthRasterStyle(
  'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_NextGeneration/default/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpg',
  '#bcdcf2' // pale sky-blue void beyond the globe edge, before/around tiles
);
const MAP_STYLE_NIGHT = buildEarthRasterStyle(
  'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
  '#000005' // near-black void, i.e. space
);
// Default to night mode outside 06:00–18:00 local time; a manual toggle button can override this per-session.
let _mapDarkMode = (() => { const h = new Date().getHours(); return h < 6 || h >= 18; })();
function currentMapStyle() { return _mapDarkMode ? MAP_STYLE_NIGHT : MAP_STYLE_DAY; }

/* Atmospheric halo around the globe edge + a matching sky/space backdrop,
   using MapLibre's built-in sky API (map.setSky). setStyle() clears this
   along with everything else, so it's re-applied on every applyLayers()
   call rather than just once at map creation. */
function applyGlobeAtmosphere() {
  if (!_flightMap || typeof _flightMap.setSky !== 'function') return;
  try {
    _flightMap.setSky(_mapDarkMode ? {
      'sky-color': '#000005',
      'sky-horizon-blend': 0.6,
      'horizon-color': '#0d2447',
      'horizon-fog-blend': 0.6,
      'fog-color': '#000005',
      'fog-ground-blend': 0.5,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
    } : {
      'sky-color': '#1a6fd8',
      'sky-horizon-blend': 0.6,
      'horizon-color': '#bcdcf2',
      'horizon-fog-blend': 0.6,
      'fog-color': '#bcdcf2',
      'fog-ground-blend': 0.5,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
    });
    if (typeof _flightMap.setLight === 'function') {
      _flightMap.setLight({ anchor: 'map', position: [1.5, 90, 80] });
    }
  } catch (e) {}
  // Starfield only reads well against the near-black night void.
  const outer = document.querySelector('.map-outer');
  if (outer) outer.classList.toggle('map-night-bg', _mapDarkMode);
}

function generateMap() {
  if (!state.legs || !state.legs.length) { showToast('⚠ 請先填入航段資料', 'warn'); return; }
  document.getElementById('map-section').style.display = 'block';

  // Defer so the map container has a real size before MapLibre initializes

/* City display name only (no airport code) — used for the "顯示城市" map label */
function cityLabelFor(country, city) {
  if (country && GEO[country] && city && GEO[country].cities[city]) return GEO[country].cities[city].label;
  return city || '';
}

/* Ordered list of airports actually visited, in flight sequence */
function buildFlightStops() {
  const stops = [];
  state.legs.forEach((leg, i) => {
    if (i === 0) {
      stops.push({
        code:  (leg.fromAirport || '').toUpperCase(),
        place: legPlaceText(leg.fromCountry, leg.fromCity, leg.fromAirport),
        cityLabel: cityLabelFor(leg.fromCountry, leg.fromCity),
        date:  leg.depDate || '',
        kind:  'dep',
      });
    }
    stops.push({
      code:  (leg.toAirport || '').toUpperCase(),
      place: legPlaceText(leg.toCountry, leg.toCity, leg.toAirport),
      cityLabel: cityLabelFor(leg.toCountry, leg.toCity),
      date:  leg.arrDate || leg.depDate || '',
      kind:  'arr',

}

function fmtDateShort(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' });
}

/* ─── Great-circle interpolation ───
   Straight lat/lon interpolation draws the WRONG route whenever a leg
   crosses the ±180° antimeridian (e.g. Taipei → Toronto would render as a
   line through Europe instead of the true shortest path over the Pacific).
   This does a proper spherical slerp between two [lat,lon] points, then
   "unwraps" the resulting longitudes so the path stays continuous instead
   of jumping across the date line. */
function greatCirclePoints(a, b, segments = 80) {
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const lat1 = toRad(a[0]), lon1 = toRad(a[1]);
  const lat2 = toRad(b[0]), lon2 = toRad(b[1]);

  const d = 2 * Math.asin(Math.sqrt(
    Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2
  ));

  if (d < 1e-9) return [[toDeg(lon1), toDeg(lat1)]];

  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const f = i / segments;
    const A = Math.sin((1-f)*d) / Math.sin(d);
    const B = Math.sin(f*d) / Math.sin(d);
    const x = A*Math.cos(lat1)*Math.cos(lon1) + B*Math.cos(lat2)*Math.cos(lon2);
    const y = A*Math.cos(lat1)*Math.sin(lon1) + B*Math.cos(lat2)*Math.sin(lon2);
    const z = A*Math.sin(lat1) + B*Math.sin(lat2);
    const lat = Math.atan2(z, Math.sqrt(x*x + y*y));
    const lon = Math.atan2(y, x);
    pts.push([toDeg(lon), toDeg(lat)]);
  }
  // Unwrap so consecutive longitudes never jump >180° — keeps the curve
  // sweeping the short way around the globe instead of snapping backwards.
  for (let i = 1; i < pts.length; i++) {
    while (pts[i][0] - pts[i-1][0] > 180)  pts[i][0] -= 360;
    while (pts[i][0] - pts[i-1][0] < -180) pts[i][0] += 360;
  }
  return pts;
}

/* Shared by the visible map's applyLayers() and the export map — builds the
   great-circle route GeoJSON from an ordered list of plotted stops (each
   with a .latlng [lat,lon]). Hoisted out to a standalone function so the
   export map can add the exact same route line the visible map shows,
   instead of quietly having no route line at all. */
function buildRouteGeoJSONFromStops(stops) {
  const features = [];
  for (let i = 0; i < stops.length - 1; i++) {
    features.push({
      type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: greatCirclePoints(stops[i].latlng, stops[i + 1].latlng, 80) }
    });
  }
  return { type: 'FeatureCollection', features };
}

/* Procedurally draw a small triangular arrow used for route-direction symbols */
function ensureArrowIcon(map, cb) {
  if (map.hasImage('flight-arrow')) { cb(); return; }
  const size = 16;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#5eead4';
  ctx.beginPath();
  ctx.moveTo(size*0.5, size*0.12);   // tip (points "up" — MapLibre rotates this to match line bearing)
  ctx.lineTo(size*0.82, size*0.85);
  ctx.lineTo(size*0.5, size*0.65);
  ctx.lineTo(size*0.18, size*0.85);
  ctx.closePath();
  ctx.fill();
  map.addImage('flight-arrow', ctx.getImageData(0, 0, size, size), { pixelRatio: 2 });
  cb();
}

function renderFlightMap() {
  const container = document.getElementById('flight-map');
  const legend = document.getElementById('map-legend');
  if (!container) return;
  if (typeof maplibregl === 'undefined') {
    container.innerHTML = '<div class="map-empty">⚠ 地圖元件載入失敗，請確認網路連線後重新整理</div>';
    return;
  }

  const showCity    = document.getElementById('map-show-city')?.checked;
  const showDate    = document.getElementById('map-show-date')?.checked;
  const showRoute   = document.getElementById('map-show-route')?.checked;
  const showBorders = document.getElementById('map-show-borders')?.checked;

  const stops = buildFlightStops();
  const plotted = [];
  const missing = [];
  const seenCount = {};
  stops.forEach((s, idx) => {
    const coord = AIRPORT_COORDS[s.code];
    if (coord) {
      const n = seenCount[s.code] || 0;
      seenCount[s.code] = n + 1;
      plotted.push({ ...s, order: idx + 1, latlng: coord, repeatIdx: n });
    } else if (s.code) missing.push(s.code);
  });

  if (!plotted.length) {
    container.innerHTML = '<div class="map-empty">⚠ 尚無可定位的機場座標，請先填入航段的出發／目的地機場</div>';
    legend.innerHTML = '';
    _mapPlottedStops = [];
    return;
  }
  _mapPlottedStops = plotted;

  const buildRouteGeoJSON = () => buildRouteGeoJSONFromStops(plotted);

  const applyLayers = () => {
    const map = _flightMap;
    try { map.setFog({}); } catch(e) {}
    applyGlobeAtmosphere();

    const borderVis = showBorders ? 'visible' : 'none';
    ['admin1-line', 'admin0-line', 'admin1-label', 'admin0-label'].forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', borderVis);
    });

    const routeData = buildRouteGeoJSON();
    if (map.getSource('flight-route')) {
      map.getSource('flight-route').setData(routeData);
      map.setLayoutProperty('flight-route-line', 'visibility', showRoute ? 'visible' : 'none');
      if (map.getLayer('flight-route-arrows')) {
        map.setLayoutProperty('flight-route-arrows', 'visibility', showRoute ? 'visible' : 'none');
      }
    } else {
      map.addSource('flight-route', { type: 'geojson', data: routeData, lineMetrics: true });
      map.addLayer({
        id: 'flight-route-line', type: 'line', source: 'flight-route',
        layout: { 'line-cap': 'round', 'line-join': 'round', visibility: showRoute ? 'visible' : 'none' },
        paint: { 'line-color': '#5eead4', 'line-width': 2.4, 'line-opacity': 0.85, 'line-dasharray': [0.2, 1.6] }
      });
      ensureArrowIcon(map, () => {
        if (!map.getLayer('flight-route-arrows')) {
          map.addLayer({
            id: 'flight-route-arrows', type: 'symbol', source: 'flight-route',
            layout: {
              'symbol-placement': 'line', 'symbol-spacing': 70,
              'icon-image': 'flight-arrow', 'icon-size': 0.9,
              'icon-rotation-alignment': 'map', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
              visibility: showRoute ? 'visible' : 'none'
            }
          });
        }
      });
    }

    // Markers — glowing city-light dots, pixel-offset when an airport repeats
    // (e.g. a round trip back to the departure city) so they never fully overlap.
    _mapMarkers.forEach(m => m.remove());
    _mapMarkers = [];
    plotted.forEach(p => {
      const labelParts = [];
      if (showCity && p.cityLabel) labelParts.push(p.cityLabel);
      if (showDate && p.date) labelParts.push(fmtDateShort(p.date));
      const labelText = labelParts.join(' · ');

      const el = document.createElement('div');
      el.className = 'city-glow-marker';
      const dotKind = (p.kind === 'dep' && p.order === 1) ? 'dep' : 'arr';
      el.innerHTML = `<div class="glow-dot ${dotKind}"></div><div class="glow-num">${p.order}</div>`;

      const step = 16;
      const offset = p.repeatIdx === 0 ? [0, 0] : [step * p.repeatIdx, -step * p.repeatIdx];

      if (labelText) {
        const labelEl = document.createElement('div');
        labelEl.className = 'map-marker-label';
        labelEl.style.cssText = 'position:absolute;left:50%;bottom:26px;transform:translateX(-50%)';
        labelEl.textContent = labelText;
        el.appendChild(labelEl);
      }

      const marker = new maplibregl.Marker({ element: el, offset })
        .setLngLat([p.latlng[1], p.latlng[0]])
        .setPopup(new maplibregl.Popup({ offset: [offset[0], offset[1] - 18] }).setHTML(
          `<b>${esc(p.place)}</b><br>${esc(p.code)}${p.date ? '<br>' + esc(fmtDate(p.date)) : ''}`
        ))
        .addTo(map);
      _mapMarkers.push(marker);
    });

    const bounds = new maplibregl.LngLatBounds();
    plotted.forEach(p => bounds.extend([p.latlng[1], p.latlng[0]]));
    map.fitBounds(bounds, { padding: 60, maxZoom: 6, duration: 500 });
  };

  if (!_flightMap) {
    container.innerHTML = '';
    _flightMap = new maplibregl.Map({
      container: 'flight-map',
      style: currentMapStyle(),
      center: [plotted[0].latlng[1], plotted[0].latlng[0]],
      zoom: 2,
      preserveDrawingBuffer: true, // required so getCanvas() can be read back out for JPG export
    });
    _flightMap.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    // In globe (3D) mode, a plain left-click-drag already rotates the globe
    // (panning the camera = spinning the sphere underneath it). Explicitly
    // enable rotate/pitch interactions too, for two-finger / right-drag tilt.
    _flightMap.dragRotate.enable();
    _flightMap.touchZoomRotate.enableRotation();
    _flightMap.on('load', applyLayers);
  } else {
    _flightMap.resize();
    // NOTE: 'load' is a Map lifecycle event that fires exactly once, the
    // very first time the map finishes loading — it will never fire again
    // after a later setStyle() call, so it's unsafe to wait on here. 'idle'
    // fires every time the map finishes rendering (including after every
    // style change), so it's the correct event to fall back to.
    if (_flightMap.isStyleLoaded()) applyLayers();
    else _flightMap.once('idle', applyLayers);
  }

  legend.innerHTML = plotted.map(p =>
    `<span class="map-legend-chip"><span class="num">${p.order}</span>${esc(p.code)}${p.date ? ' · ' + esc(fmtDateShort(p.date)) : ''}</span>`
  ).join('') + (missing.length
    ? `<span class="map-legend-chip" style="color:#f87171;border-color:rgba(248,113,113,.4)">⚠ 無座標資料：${missing.map(esc).join(', ')}</span>`
    : '');
}

function toggleMapProjection() {
  if (!_flightMap) return;
  if (!_flightMap.isStyleLoaded || !_flightMap.isStyleLoaded()) {
    showToast('⏳ 地圖仍在載入中，請稍候再切換', 'warn');
    return;
  }
  const btn = document.getElementById('map-proj-btn');
  _mapIs3D = !_mapIs3D;
  try {
    if (typeof _flightMap.setProjection === 'function') {
      _flightMap.setProjection({ type: _mapIs3D ? 'globe' : 'mercator' });
    }
    _flightMap.easeTo({ pitch: _mapIs3D ? 45 : 0, duration: 600 });
    if (btn) btn.textContent = _mapIs3D ? '🗺 切換 2D 平面' : '🌐 切換 3D 地球';
  } catch (e) {
    _mapIs3D = !_mapIs3D;
    showToast('⚠ 此瀏覽器不支援 3D 地球模式', 'warn');
  }
}

/* Manual white-bg/blue-ocean (day) ↔ dark night-lights (night) basemap switch.
   setStyle() wipes all custom sources/layers, so once the new style finishes
   loading we re-run renderFlightMap() to redraw the route line/arrows and
   re-apply the 3D globe projection if it was active. DOM markers (glow dots,
   labels, popups) live outside the style and survive setStyle untouched. */
function toggleMapDayNight() {
  if (!_flightMap) return;
  if (!_flightMap.isStyleLoaded || !_flightMap.isStyleLoaded()) {
    showToast('⏳ 地圖仍在載入中，請稍候再切換', 'warn');
    return;
  }
  _mapDarkMode = !_mapDarkMode;
  const btn = document.getElementById('map-daynight-btn');
  if (btn) btn.textContent = _mapDarkMode ? '☀️ 切換白天模式' : '🌙 切換夜間模式';
  // Register the listener BEFORE calling setStyle(). Registering it after
  // (the previous order) races setStyle(): if the target style URL was
  // already fetched once this session (e.g. switching back to a mode we've
  // visited before), the browser cache can resolve it fast enough that
  // 'style.load' fires before the .once() call below even runs — silently
  // dropping the re-render, which is why re-applying the deep ocean color
  // only worked the first time and reverted to the flat default on repeat
  // toggles back to day mode.
  _flightMap.once('style.load', () => {
    if (_mapIs3D && typeof _flightMap.setProjection === 'function') {
      _flightMap.setProjection({ type: 'globe' });
    }
    renderFlightMap();
  });
  _flightMap.setStyle(currentMapStyle());
}

/* Small canvas helper for the rounded label chips drawn during export. */
function _roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* Export the current flight map as a JPG or transparent PNG.

   Earlier versions of this captured a SEPARATE, freshly-created MapLibre
   map instance (copying over center/zoom/bearing/pitch) so the visible map
   never had to resize. That turned out to be fragile: a fresh map doesn't
   share the live map's internal longitude-wrap state, so after dragging
   the 3D globe around, the same raw coordinates could project to
   completely different — even off-canvas — pixel positions in the copy
   (missing markers, wrong framing).

   This version captures the ACTUAL live map instead. It's temporarily
   moved off-screen (position:fixed, far outside the viewport) and enlarged
   for one high-resolution render, then moved back — same instance, same
   camera, same wrap state throughout, so what gets captured is guaranteed
   to be exactly what was on screen. Nothing visibly flashes because the
   resize happens while the element is already off-screen. */
/* Export format is a tiny split-button menu (📷 匯出圖片 + a ▾ caret) rather
   than a separate dropdown — see the HTML/CSS for .map-export-split. */
let _mapExportFormat = 'jpg';

function toggleExportFormatMenu(evt) {
  evt.stopPropagation();
  const menu = document.getElementById('map-export-menu');
  if (!menu) return;
  const opening = !menu.classList.contains('open');
  menu.classList.toggle('open', opening);
  if (opening) {
    const closeOnce = () => menu.classList.remove('open');
    setTimeout(() => document.addEventListener('click', closeOnce, { once: true }), 0);
  }
}

function setExportFormat(fmt) {
  _mapExportFormat = fmt;
  document.querySelectorAll('#map-export-menu .map-export-menu-item').forEach(el => {
    el.textContent = (el.dataset.fmt === fmt ? '✓ ' : '　') + (el.dataset.fmt === 'png' ? 'PNG（透明背景）' : 'JPG（一般）');
  });
  document.getElementById('map-export-menu')?.classList.remove('open');
}

/* Capture the flight map exactly as it currently renders — no resizing.
   An earlier version temporarily enlarged the map container first, hoping
   for a sharper export; that enlargement changed what the map actually
   rendered (a wider/taller viewport at the same zoom shows a different,
   sometimes double-wrapped extent — that's what caused markers and framing
   to drift from what was on screen). Capturing at the exact on-screen size
   removes that entire category of mismatch: same container, same camera,
   same everything the map is already rendering — what you see really is
   what gets exported. The trade-off is the image resolution is capped to
   however large the map panel currently is on screen; making the browser
   window wider before exporting increases it. */
function exportMapImage() {
  if (!_flightMap) { showToast('⚠ 請先產生地圖', 'warn'); return; }
  if (!_flightMap.isStyleLoaded || !_flightMap.isStyleLoaded()) {
    showToast('⏳ 地圖仍在載入中，請稍候再匯出', 'warn');
    return;
  }
  showToast('⏳ 正在產生圖片…', 'success');

  const format = _mapExportFormat === 'png' ? 'png' : 'jpg';

  // For a transparent PNG, hide the style's own background fill so the
  // WebGL canvas genuinely leaves empty pixels transparent instead of
  // painted solid — that's what "去背" (cut out the background) means here.
  const bgLayerId = 'bg';
  const hasBgLayer = !!_flightMap.getLayer(bgLayerId);
  if (format === 'png' && hasBgLayer) {
    _flightMap.setLayoutProperty(bgLayerId, 'visibility', 'none');
  }

  const restore = () => {
    if (format === 'png' && hasBgLayer) {
      _flightMap.setLayoutProperty(bgLayerId, 'visibility', 'visible');
    }
  };

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    try { _captureMapToImage(format); }
    finally { restore(); }
  };
  _flightMap.once('idle', finish);
  _flightMap.triggerRepaint();
  setTimeout(finish, 1500); // safety fallback in case 'idle' doesn't fire
}

function _captureMapToImage(format) {
  let srcCanvas;
  try { srcCanvas = _flightMap.getCanvas(); } catch (e) { srcCanvas = null; }
  if (!srcCanvas) { showToast('⚠ 地圖尚未準備好，請稍候再匯出', 'warn'); return; }

  const dpr = window.devicePixelRatio || 1;
  const w = srcCanvas.width, h = srcCanvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');

  if (format !== 'png') {
    // Opaque export: a solid backstop fill, in case any pixel wasn't
    // painted by the map's own background layer. Harmless no-op anywhere
    // the map already covered — the map's own render draws right over it.
    ctx.fillStyle = _mapDarkMode ? '#000005' : '#bcdcf2';
    ctx.fillRect(0, 0, w, h);
  }
  try {
    ctx.drawImage(srcCanvas, 0, 0, w, h);
  } catch (e) {
    showToast('⚠ 匯出失敗，瀏覽器不支援讀取地圖畫布內容', 'warn');
    return;
  }

  const showCity = document.getElementById('map-show-city')?.checked;
  const showDate = document.getElementById('map-show-date')?.checked;

  // In a wide, zoomed-out 2D view, mercator repeats the whole world at
  // both edges (visible in the export as two copies of Europe/Africa) — a
  // given longitude then has more than one on-screen position, and
  // map.project() picks whichever it internally judges "nearest," which at
  // this aspect/zoom doesn't always match the copy actually rendered where
  // expected. Explicitly resolving each stop's longitude to the copy
  // nearest the map's own center removes that ambiguity — this is what
  // made round-trip stops back at the departure city (repeated airport,
  // same lng) sporadically vanish off one edge of the export.
  const mapCenterLng = _flightMap.getCenter().lng;
  const unwrapNearCenter = lng => {
    let l = lng;
    while (l - mapCenterLng > 180) l -= 360;
    while (l - mapCenterLng < -180) l += 360;
    return l;
  };

  (_mapPlottedStops || []).forEach(p => {
    const pt = _flightMap.project([unwrapNearCenter(p.latlng[1]), p.latlng[0]]);
    const step = 16 * dpr;
    const ox = p.repeatIdx === 0 ? 0 : step * p.repeatIdx;
    const oy = p.repeatIdx === 0 ? 0 : -step * p.repeatIdx;
    const x = pt.x * dpr + ox, y = pt.y * dpr + oy;
    const isDep = (p.kind === 'dep' && p.order === 1);
    const color = isDep ? '#5eead4' : '#fbbf24';

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 14 * dpr;
    ctx.beginPath();
    ctx.arc(x, y, 4.5 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, 8 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = 'white';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.fillStyle = '#04222b';
    ctx.font = `800 ${9 * dpr}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(p.order), x, y + 0.5 * dpr);

    const labelParts = [];
    if (showCity && p.cityLabel) labelParts.push(p.cityLabel);
    if (showDate && p.date) labelParts.push(fmtDateShort(p.date));
    const labelText = labelParts.join(' · ');
    if (labelText) {
      ctx.font = `700 ${10.5 * dpr}px sans-serif`;
      const padX = 7 * dpr;
      const tw = ctx.measureText(labelText).width;
      const bw = tw + padX * 2, bh = 18 * dpr;
      const bx = x - bw / 2, by = y - 26 * dpr - bh;
      ctx.fillStyle = 'rgba(15,32,50,0.92)';
      ctx.strokeStyle = 'rgba(94,234,212,0.4)';
      ctx.lineWidth = 1 * dpr;
      _roundRectPath(ctx, bx, by, bw, bh, 6 * dpr);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#e5f6fb';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, x, by + bh / 2 + 0.5 * dpr);
    }
  });

  const link = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  const ext = format === 'png' ? 'png' : 'jpg';
  link.download = `flight-map-${stamp}.${ext}`;
  link.href = format === 'png' ? out.toDataURL('image/png') : out.toDataURL('image/jpeg', 0.95);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast(`✅ 已匯出地圖 ${ext.toUpperCase()}`, 'success');
}

async function exportScheduleExcel() {
  if (!window.ExcelJS){showToast('⚠ ExcelJS 尚未載入','warn');return;}
  const s = schedState; if (!s) return;

    c.alignment={vertical:'middle',horizontal:'center'};
    c.border={right:{style:'thin',color:{argb:'FFEDE9FE'}},bottom:{style:'thin',color:{argb:'FFE0E7FF'}}};
  });
  ws.getRow(2).height=30;

  const lC=ws.getCell(3,1);
  lC.value='📍 地點';
  lC.font={bold:true,size:9,color:{argb:'FF1D4ED8'},name:'Arial'};

  lC.alignment={vertical:'middle',horizontal:'center'};
  lC.border={right:{style:'medium',color:{argb:'FF93C5FD'}},bottom:{style:'medium',color:{argb:'FFA78BFA'}}};
  s.dates.forEach((d,ci)=>{

  ws.getRow(3).height=26;

  s.times.forEach((t,ri)=>{

    const isNoteR = s.rowTypes && s.rowTypes[ri] === 'note';
    ws.getRow(rn).height=22;
    const tc=ws.getCell(rn,1);

    tc.font={bold:true,size:9,color:{argb: isNoteR ? 'FFD97706' : 'FF1D4ED8'},name:'Arial'};

    tc.border={right:{style:'medium',color:{argb:'FF93C5FD'}},bottom:{style:'thin',color:{argb:'FFE5E7EB'}}};
    s.dates.forEach((d,ci)=>{
      if (sMergeCovered(ri,ci)) return;
      const mg=sMergeOrigin(ri,ci);
      const cn=ci+CO;

  ntc.alignment={vertical:'middle',horizontal:'center'};
  ntc.border={top:{style:'medium',color:{argb:'FF6EE7B7'}},right:{style:'medium',color:{argb:'FF86EFAC'}}};
  s.dates.forEach((d,ci)=>{
    const nc = (s.noteContent&&s.noteContent[String(ci)]) || '';
    const c = ws.getCell(noteRn,ci+CO);
    c.value=nc;
    c.font={size:10,name:'Arial',color:{argb:'FF374151'}};
    c.alignment={vertical:'top',horizontal:'left',wrapText:true};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0FDF4'}};
    c.border={top:{style:'medium',color:{argb:'FF6EE7B7'}},right:{style:'thin',color:{argb:'FFBBF7D0'}}};
  });

  ws.views=[{state:'frozen',xSplit:1,ySplit:3}];
  ws.getColumn(1).width=12;
  s.dates.forEach((d,ci)=>{ws.getColumn(ci+CO).width=20;});

  const fname=`schedule_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.xlsx`;
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if (window.showSaveFilePicker) {
    try {
      const h2=await window.showSaveFilePicker({
        suggestedName:fname,
        types:[{description:'Excel 檔案',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]
      });
      const w=await h2.createWritable(); await w.write(blob); await w.close();
      showToast('✅ 已儲存 '+h2.name,'success'); return;
    } catch(e){if(e.name==='AbortError')return;}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ 已匯出行程時間表','success');
}

/* ─── Init ─── */
/* ─── 數字時鐘邏輯 ─── */
const TZ_MAP = {
  TW: 'Asia/Taipei', JP: 'Asia/Tokyo', KR: 'Asia/Seoul',
  SG: 'Asia/Singapore', HK: 'Asia/Hong_Kong', TH: 'Asia/Bangkok', GB: 'Europe/London',
  FR: 'Europe/Paris', DE: 'Europe/Berlin', IT: 'Europe/Rome', ES: 'Europe/Madrid',
  AT: 'Europe/Vienna', CH: 'Europe/Zurich', BE: 'Europe/Brussels', PT: 'Europe/Lisbon',
  NL: 'Europe/Amsterdam', SE: 'Europe/Stockholm', DK: 'Europe/Copenhagen', NO: 'Europe/Oslo',
  FI: 'Europe/Helsinki', CZ: 'Europe/Prague', HU: 'Europe/Budapest', PL: 'Europe/Warsaw',
  GR: 'Europe/Athens', TR: 'Europe/Istanbul', AU: 'Australia/Sydney', NZ: 'Pacific/Auckland',
  CA: 'America/Toronto', CN: 'Asia/Shanghai', AE: 'Asia/Dubai', SA: 'Asia/Riyadh',
  MY: 'Asia/Kuala_Lumpur', PH: 'Asia/Manila', ID: 'Asia/Jakarta', VN: 'Asia/Ho_Chi_Minh',
  KH: 'Asia/Phnom_Penh', MV: 'Indian/Maldives', IN: 'Asia/Kolkata', QA: 'Asia/Qatar', ZA: 'Africa/Johannesburg'
};

/* USA spans multiple time zones — split into West/Central/East instead of
   one single "美國" entry pinned to Pacific time. */
const US_ZONES = [
  { label: '🇺🇸 美西 US Pacific',  tz: 'America/Los_Angeles' },
  { label: '🇺🇸 美中 US Central',  tz: 'America/Chicago' },
  { label: '🇺🇸 美東 US Eastern',  tz: 'America/New_York' },
];

/* Build the flat zone list shown in the clock dropdowns: one entry per
   country (from TZ_MAP), except the US which expands to its three zones,
   inserted alphabetically where "美國" would otherwise sort. */
function buildClockZones() {
  const sortedCountries = Object.entries(GEO)
    .filter(([code]) => code !== 'US')
    .sort((a, b) => a[1].label.localeCompare(b[1].label, 'zh-TW'));
  const zones = sortedCountries.map(([code, data]) => ({ label: data.label, tz: TZ_MAP[code] || 'UTC' }));
  const usLabel = GEO.US ? GEO.US.label : '🇺🇸 美國 United States';
  const insertAt = zones.findIndex(z => z.label.localeCompare(usLabel, 'zh-TW') > 0);
  zones.splice(insertAt < 0 ? zones.length : insertAt, 0, ...US_ZONES);
  return zones;
}

function initClocks() {
  const sel1 = document.getElementById('clock-1-tz');
  const sel2 = document.getElementById('clock-2-tz');
  if (!sel1 || !sel2) return;
  const localTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const zones = buildClockZones();
  const optionsHTML = zones.map(z => `<option value="${z.tz}">${z.label}</option>`).join('');
  sel1.innerHTML = optionsHTML;
  sel2.innerHTML = optionsHTML;
  const localMatch = zones.find(z => z.tz === localTZ);
  if (localMatch) sel1.value = localMatch.tz;
  if (sel2.options.length > 1) sel2.selectedIndex = 1;
  setInterval(updateClockDisplay, 1000);
  updateClockDisplay();
}

/* Compute UTC offset in minutes for a given IANA timezone at a given moment */
function tzOffsetMinutes(tz, date = new Date()) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const parts = dtf.formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  const hh = parts.hour === '24' ? '00' : parts.hour;
  const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +hh, +parts.minute, +parts.second);
  return Math.round((asUTC - date.getTime()) / 60000);
}

/* Short zone abbreviation, e.g. PST / JST / GMT+8 (best-effort, depends on browser ICU data) */
function tzAbbr(tz, date = new Date()) {
  try {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(date);
    const p = parts.find(x => x.type === 'timeZoneName');
    return p ? p.value : '';
  } catch (e) { return ''; }
}

function tzOffsetLabel(mins) {
  const sign = mins < 0 ? '-' : '+';
  const abs = Math.abs(mins);
  const hh = String(Math.floor(abs / 60)).padStart(2, '0');
  const mm = String(abs % 60).padStart(2, '0');
  return `UTC${sign}${hh}:${mm}`;
}

function updateClockDisplay() {
  const update = (id) => {
    const elTz = document.getElementById(`clock-${id}-tz`);
    if (!elTz) return;
    const tz = elTz.value;
    const now = new Date();
    try {
      document.getElementById(`clock-${id}-time`).textContent = now.toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById(`clock-${id}-date`).textContent = now.toLocaleDateString('zh-TW', { timeZone: tz, month: 'short', day: 'numeric', weekday: 'short' });
      const abbr = tzAbbr(tz, now);
      const offsetLbl = tzOffsetLabel(tzOffsetMinutes(tz, now));
      const detailEl = document.getElementById(`clock-${id}-detail`);
      if (detailEl) detailEl.textContent = abbr && abbr !== offsetLbl ? `${abbr} · ${offsetLbl}` : offsetLbl;
    } catch(e) {}
  };
  update(1); update(2);
}
// 啟動時鐘
initClocks();
render();
</script>
